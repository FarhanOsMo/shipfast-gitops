apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shipfast
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FarhanOsMo/shipfast-gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: shipfast
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
